# Production-like stack: PostgreSQL + MilcsoGuard API/dashboard.
# Put a TLS-terminating reverse proxy (Caddy / nginx / Traefik) in front of port 8080.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: milcsoguard
      POSTGRES_USER: milcsoguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milcsoguard -d milcsoguard"]
      interval: 10s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://milcsoguard:${POSTGRES_PASSWORD}@db:5432/milcsoguard
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8080:8080"   # only reachable through the reverse proxy

volumes:
  pgdata:
